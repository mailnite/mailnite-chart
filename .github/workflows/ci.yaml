name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  HELM3: v3.22.0
  HELM4: v4.3.0
  KUBECONFORM: v0.8.0

jobs:
  # Every example and edge case, rendered by Helm 3 AND 4, validated against
  # the Kubernetes + CRD schemas (Gateway API, GKE policies), and asserted on
  # what each exposure must and must not create; bad values must fail.
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tools (checksum-verified)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP"
          for v in "$HELM3" "$HELM4"; do
            f="helm-$v-linux-amd64.tar.gz"
            curl -fsSLO "https://get.helm.sh/$f"
            curl -fsSL "https://get.helm.sh/$f.sha256sum" | sha256sum -c -
            tar -xzf "$f" && mv linux-amd64/helm "bin/helm-${v%%.*}" && rm -rf linux-amd64
          done
          k=kubeconform-linux-amd64.tar.gz
          curl -fsSLO "https://github.com/yannh/kubeconform/releases/download/$KUBECONFORM/$k"
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/$KUBECONFORM/CHECKSUMS" | grep " $k\$" | sha256sum -c -
          tar -xzf "$k" kubeconform && mv kubeconform bin/
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          python3 -m pip install --quiet pyyaml
      - run: helm-v3 lint --strict charts/mailnite && helm-v4 lint --strict charts/mailnite
      - run: python3 ci/test_chart.py
        env:
          HELM: helm-v3 helm-v4
          KUBECONFORM: kubeconform

  # A real install on kind: the init container mints a well-formed key, the
  # console answers through port-forward, one updater run succeeds, and an
  # upgrade keeps the key. Skipped (with a notice) while the chart's
  # appVersion image is not yet on Docker Hub — the chart may be bumped
  # before the release it needs is cut.
  smoke:
    runs-on: ubuntu-latest
    needs: render
    steps:
      - uses: actions/checkout@v7
      - name: Is the chart's image published?
        id: img
        run: |
          tag=$(awk -F'"' '/^appVersion:/{print $2}' charts/mailnite/Chart.yaml)
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://hub.docker.com/v2/repositories/mailnite/mailnite/tags/$tag")
          if [ "$code" = 200 ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::mailnite/mailnite:$tag is not published yet — smoke test skipped"
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: helm/kind-action@v1
        if: steps.img.outputs.published == 'true'
      - name: Install, mint, answer, update, upgrade
        if: steps.img.outputs.published == 'true'
        run: |
          set -euo pipefail
          ns=mail
          helm install mailnite charts/mailnite -n $ns --create-namespace
          kubectl -n $ns wait --for=jsonpath='{.status.phase}'=Running pod/mailnite-0 --timeout=300s \
            || { kubectl -n $ns describe pod mailnite-0; kubectl -n $ns logs mailnite-0 -c keys || true; exit 1; }

          # the key init container minted a 32-byte standard-base64 key
          smk=$(kubectl -n $ns get secret mailnite-keys -o jsonpath='{.data.MAIL_SMK}' | base64 -d)
          test "$(printf '%s' "$smk" | base64 -d | wc -c)" -eq 32

          # the console answers (onboarding scope) through port-forward
          kubectl -n $ns port-forward sts/mailnite 8480:8480 >/dev/null & pf=$!
          for i in $(seq 30); do curl -fsS http://127.0.0.1:8480/mail/api/setup/status && break; sleep 2; done
          kill $pf

          # one updater run completes (up to date, or moved forward)
          kubectl -n $ns create job --from=cronjob/mailnite-update upd
          kubectl -n $ns wait --for=condition=complete job/upd --timeout=300s \
            || { kubectl -n $ns logs job/upd; exit 1; }
          kubectl -n $ns logs job/upd

          # an upgrade never touches the key
          helm upgrade mailnite charts/mailnite -n $ns --reuse-values
          kubectl -n $ns delete pod mailnite-0 --wait
          kubectl -n $ns wait --for=jsonpath='{.status.phase}'=Running pod/mailnite-0 --timeout=300s
          test "$(kubectl -n $ns get secret mailnite-keys -o jsonpath='{.data.MAIL_SMK}' | base64 -d)" = "$smk"
