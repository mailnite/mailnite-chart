name: release

# Tag vX.Y.Z (= Chart.yaml version) → the packaged chart on GHCR as an OCI
# artifact, plus a GitHub release carrying the .tgz:
#
#   helm install mailnite oci://ghcr.io/mailnite/charts/mailnite --version X.Y.Z
#
# One-time: after the first push, make the package public
# (github.com/orgs/mailnite/packages → charts/mailnite → Package settings).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Helm (checksum-verified)
        run: |
          set -euo pipefail
          v=v4.3.0; f="helm-$v-linux-amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://get.helm.sh/$f"
          curl -fsSL "https://get.helm.sh/$f.sha256sum" | sha256sum -c -
          tar -xzf "$f" && sudo mv linux-amd64/helm /usr/local/bin/helm
      - name: The tag must be the chart version
        run: |
          v=$(awk '/^version:/{print $2}' charts/mailnite/Chart.yaml)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::Chart.yaml version $v does not match tag $GITHUB_REF_NAME"; exit 1; }
      - name: Package and push
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          helm lint --strict charts/mailnite
          helm package charts/mailnite -d dist
          printf '%s' "$TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          helm push dist/mailnite-*.tgz oci://ghcr.io/mailnite/charts
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tgz --verify-tag --generate-notes
