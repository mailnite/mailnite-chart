# Mailnite single-node (embedded badger) — the simple stateful install.
# The cluster mode (consensusdb) is deliberately NOT this chart.

image:
  # The image the release pipeline actually publishes (alpine-based, WITH
  # ca-certificates — outbound TLS verification needs the CA trust store).
  # A custom image must install ca-certificates too, or every remote
  # certificate verifies as "unknown authority".
  repository: mailnite/mailnite
  tag: ""              # empty = the chart's appVersion
  pullPolicy: IfNotPresent
imagePullSecrets: []

# ONE replica — badger has a single writer. Scaling this up is not supported.
replicaCount: 1

# Resources are named `mailnite` regardless of the release name, so the names
# in the notes, the docs and your runbooks stay true: statefulset/mailnite,
# svc/mailnite, svc/mailnite-mail. The cost is that two releases cannot share
# a namespace — give a second install its own, or rename it here.
fullnameOverride: ""

# Config, keys and the mail store on one PersistentVolume mounted at /data.
# MAIL_HOME_DIR=/data makes the volume the layout: /data/{conf,data,log}.
persistence:
  enabled: true
  size: 10Gi
  storageClass: ""     # "" = the cluster default
  accessModes: [ReadWriteOnce]

# --- secrets: two patterns, both optional -----------------------------------
# 1) ENV — every config property maps to an env var generically
#    (mail.keeper-url → MAIL_KEEPER_URL; the SMK rides MAIL_SMK
#    with mail.keeper-url: env://MAIL_SMK, …). Put the sensitive ones in a Secret and name it
#    here; it is attached with envFrom.
envFromSecret: ""
# 2) FILES — a Secret mounted read-only at /data/conf/secrets.
#    Reference its entries from the config by RELATIVE path (resolved against
#    the config directory), e.g.:  mail.keeper-url: secrets/mailnite.key
filesSecret: ""

# Extra literal env vars: [{ name: MAIL_DOMAIN, value: example.com }]
extraEnv: []

service:
  # Webmail (HTTP/HTTPS). ClusterIP by default — front it with your ingress or
  # switch the type. The setup console (8480) also rides this service so
  # `kubectl port-forward svc/…` works, but ClusterIP keeps it cluster-private.
  web:
    type: ClusterIP
    httpPort: 8080
    httpsPort: 8443
  # Mail protocols. Off by default; enable once onboarding is done. The
  # standard public ports map onto the server's high internal binds — KEEP the
  # high "dev" binds on the wizard's Ports step, this Service does the 25→2525
  # translation at the edge (no NET_BIND_SERVICE needed in the pod).
  mail:
    enabled: false
    type: LoadBalancer
    annotations: {}
    ports:
      - { name: smtp,        port: 25,  targetPort: 2525 }
      - { name: submissions, port: 465, targetPort: 2465 }
      - { name: submission,  port: 587, targetPort: 2587 }
      - { name: imaps,       port: 993, targetPort: 2993 }

resources: {}
  # requests: { cpu: 250m, memory: 512Mi }
  # limits:   { memory: 2Gi }

# Pod and container defaults meet the Kubernetes Restricted profile without
# granting privileges the high internal listen ports do not need.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]

# Restrict ingress to the ports actually published by the chart. Egress is
# allow-listed for DNS, HTTP(S), SMTP delivery/smarthosts and mailrelay. Add a
# rule for private S3, OIDC, LDAP or non-standard smarthost endpoints.
networkPolicy:
  enabled: true
  ingress:
    # Empty means any source may reach the declared web/mail ports. Replace
    # with namespaceSelector/podSelector/ipBlock entries to narrow callers.
    from: []
    additionalRules: []
  egress:
    enabled: true
    # Empty means any destination, but only on the ports below.
    to: []
    ports:
      - { port: 53, protocol: UDP }
      - { port: 53, protocol: TCP }
      - { port: 80, protocol: TCP }
      - { port: 443, protocol: TCP }
      - { port: 25, protocol: TCP }
      - { port: 465, protocol: TCP }
      - { port: 587, protocol: TCP }
      - { port: 2525, protocol: TCP }
      - { port: 8443, protocol: TCP }
      - { port: 8443, protocol: UDP }
    additionalRules: []

# The single stateful replica cannot be made highly available, so protect it
# from voluntary eviction. Disable or relax this temporarily when intentionally
# draining the only node.
podDisruptionBudget:
  enabled: true
  minAvailable: 1
  maxUnavailable: null

# This is immediately useful if a future external-store deployment raises the
# replica count, and remains scheduling-safe on a one-node installation.
topologySpread:
  enabled: true
  maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: ScheduleAnyway

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
timezone: ""           # e.g. Europe/Amsterdam → TZ env
