{{- include "mailnite.validate" . -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "mailnite.fullname" . }}
  labels: {{- include "mailnite.labels" . | nindent 4 }}
spec:
  # ONE replica by design: the embedded badger store has a single writer.
  replicas: 1
  serviceName: {{ include "mailnite.fullname" . }}-hl
  # OrderedReady (the default) will not roll a pod that is Running but not
  # Ready — and this pod is deliberately un-Ready until onboarding is finished,
  # because readiness means "configured and serving mail". The two rules
  # deadlock: a server still on the wizard can never receive a new image, and
  # `helm upgrade` reports success because the StatefulSet DID change — the
  # controller is what declines to act on it.
  #
  # Parallel drops that precondition, and costs nothing at one replica: pod
  # ordering only exists between replicas, and the single-writer rule is held
  # by the pod NAME (there cannot be two mailnite-0), not by this policy.
  podManagementPolicy: Parallel
  selector:
    matchLabels: {{- include "mailnite.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "mailnite.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "mailnite.fullname" . }}
      # No API credentials for the mail server itself. Only the key init
      # container gets a token (its own projected volume, below).
      automountServiceAccountToken: false
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if include "mailnite.mintKeys" . }}
      initContainers:
        # Mints the Server Master Key Secret on the first start, verifies it
        # on every later one, and refuses to mint a second key for a store that
        # already exists (see `mailnite k8s keys --help`).
        - name: keys
          image: {{ include "mailnite.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          args: ["k8s", "keys", "--secret", {{ include "mailnite.keysSecret" . | quote }}]
          env:
            - { name: HOME, value: /data }
            - { name: MAIL_HOME_DIR, value: /data }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: kube-api, mountPath: /var/run/secrets/kubernetes.io/serviceaccount, readOnly: true }
      {{- end }}
      containers:
        - name: mailnite
          image: {{ include "mailnite.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          args: ["run"]
          env:
            # One volume, mounted at /data, IS the layout: conf/, data/ and
            # log/ all derive from the root below, so a single variable places
            # the whole server.
            - { name: HOME, value: /data }
            - { name: MAIL_HOME_DIR, value: /data }
            # The startup banner prints `kubectl port-forward sts/mailnite …
            # -n <namespace>`; the pod learns its name from the hostname, the
            # namespace it must be told (no service-account token is mounted).
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if .Values.keys.enabled }}
            # The keeper in a pod is env://MAIL_SMK (the wizard's default).
            - name: MAIL_SMK
              valueFrom:
                secretKeyRef:
                  name: {{ include "mailnite.keysSecret" . }}
                  key: MAIL_SMK
            # Optional: carries an existing install's password pepper across a
            # rebuild; absent, the server mints one into its sealed keyring.
            - name: MAIL_PEPPER
              valueFrom:
                secretKeyRef:
                  name: {{ include "mailnite.keysSecret" . }}
                  key: MAIL_PEPPER
                  optional: true
            {{- end }}
            {{- if .Values.timezone }}
            - { name: TZ, value: {{ .Values.timezone | quote }} }
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.envFromSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.envFromSecret }}
          {{- end }}
          ports:
            - { name: console, containerPort: 8480, protocol: TCP }
            - { name: health,  containerPort: 9090, protocol: TCP }
            - { name: http,    containerPort: {{ .Values.web.httpPort }},  protocol: TCP }
            - { name: https,   containerPort: {{ .Values.web.httpsPort }}, protocol: TCP }
            {{- range $name := list "smtp" "submissions" "submission" "imaps" "imap" }}
            {{- $p := index $.Values.mail.ports $name }}
            - { name: {{ $name | trunc 15 }}, containerPort: {{ $p.targetPort }}, protocol: TCP }
            {{- end }}
          # The dedicated health port (9090) serves the probes in BOTH phases:
          # /healthz answers 200 while the process runs (liveness never gates
          # on the store), /readyz answers 503 mid-onboarding and 500 while the
          # store is unavailable — alive but out of rotation.
          livenessProbe:
            httpGet: { path: /healthz, port: health }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: health }
            initialDelaySeconds: 3
            periodSeconds: 5
          {{- with .Values.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - { name: data, mountPath: /data }
            {{- if .Values.filesSecret }}
            # Secret files land BESIDE the config; reference them by relative
            # path, e.g. tls.cert-file: secrets/tls.crt
            - { name: secret-files, mountPath: /data/conf/secrets, readOnly: true }
            {{- end }}
      {{- if or .Values.persistence.existingClaim (not .Values.persistence.enabled) (include "mailnite.mintKeys" .) .Values.filesSecret }}
      volumes:
        {{- end }}
        {{- if .Values.persistence.existingClaim }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim }}
        {{- else if not .Values.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
        {{- if include "mailnite.mintKeys" . }}
        # The standard service-account projection, mounted ONLY into the key
        # init container: the mail server's own container has no API token.
        - name: kube-api
          projected:
            sources:
              - serviceAccountToken: { path: token, expirationSeconds: 3600 }
              - configMap:
                  name: kube-root-ca.crt
                  items: [{ key: ca.crt, path: ca.crt }]
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef: { fieldPath: metadata.namespace }
        {{- end }}
        {{- if .Values.filesSecret }}
        - name: secret-files
          secret:
            secretName: {{ .Values.filesSecret }}
            defaultMode: 0400
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: {{- toYaml .Values.persistence.accessModes | nindent 10 }}
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size | quote }}
  {{- end }}
