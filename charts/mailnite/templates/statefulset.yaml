apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "mailnite.fullname" . }}
  labels: {{- include "mailnite.labels" . | nindent 4 }}
spec:
  # ONE replica by design: the embedded badger store has a single writer.
  replicas: {{ .Values.replicaCount }}
  serviceName: {{ include "mailnite.fullname" . }}-hl
  # OrderedReady (the default) will not roll a pod that is Running but not
  # Ready — and this pod is deliberately un-Ready until onboarding is finished,
  # because readiness means "configured and serving mail". The two rules
  # deadlock: a server still on the wizard can never receive a new image, and
  # `helm upgrade` reports success because the StatefulSet DID change — the
  # controller is what declines to act on it.
  #
  # Parallel drops that precondition, and costs nothing at one replica: pod
  # ordering only exists between replicas, and the single-writer rule is held
  # by the pod NAME (there cannot be two mailnite-0), not by this policy.
  podManagementPolicy: Parallel
  selector:
    matchLabels: {{- include "mailnite.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "mailnite.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001            # the PVC must be writable by the mailnite user
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: mailnite
          image: {{ include "mailnite.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["run"]
          env:
            # One volume, mounted at /data, IS the layout: conf/, data/ and
            # log/ all derive from the root below, so a single variable places
            # the whole server. MAIL_CONF_DIR / MAIL_DATA_DIR / MAIL_LOG_DIR
            # can override any one of them when they must live apart — which
            # is the Linux package's case, not a container's.
            - name: HOME
              value: /data
            - name: MAIL_HOME_DIR
              value: /data
            # The startup banner prints `kubectl port-forward sts/mailnite …
            # -n <namespace>`, because the console has no Service in front of
            # it and a pod IP helps nobody. The pod learns its own name from
            # the hostname; the namespace it must be told. The projected
            # service-account file carries it too, but only while the token is
            # mounted — this survives automountServiceAccountToken: false.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if .Values.timezone }}
            - name: TZ
              value: {{ .Values.timezone | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.envFromSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.envFromSecret }}
          {{- end }}
          ports:
            - { name: console,     containerPort: 8480, protocol: TCP }
            - { name: health,      containerPort: 9090, protocol: TCP }
            - { name: http,        containerPort: {{ .Values.service.web.httpPort }},  protocol: TCP }
            - { name: https,       containerPort: {{ .Values.service.web.httpsPort }}, protocol: TCP }
            {{- range .Values.service.mail.ports }}
            - { name: {{ .name }}, containerPort: {{ .targetPort }}, protocol: TCP }
            {{- end }}
          # The dedicated health port (9090) serves the probes in BOTH phases:
          # /healthz answers 200 while the process runs (liveness never gates
          # on the store), /readyz answers 503 mid-onboarding and while the
          # store is unavailable — so an unconfigured or storage-less pod is
          # alive but out of rotation.
          livenessProbe:
            httpGet: { path: /healthz, port: health }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: health }
            initialDelaySeconds: 3
            periodSeconds: 5
          {{- with .Values.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
            {{- if .Values.filesSecret }}
            # Secret files land BESIDE the config; reference them from the
            # config by relative path, e.g. mail.keeper-url: secrets/mailnite.key
            - name: secret-files
              mountPath: /data/conf/secrets
              readOnly: true
            {{- end }}
      {{- if .Values.filesSecret }}
      volumes:
        - name: secret-files
          secret:
            secretName: {{ .Values.filesSecret }}
            defaultMode: 0400
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: {{- toYaml .Values.persistence.accessModes | nindent 10 }}
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size | quote }}
  {{- end }}
