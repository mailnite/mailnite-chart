{{- if .Values.networkPolicy.enabled }}
{{- $egress := .Values.networkPolicy.egress }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mailnite.fullname" . }}
  labels: {{- include "mailnite.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "mailnite.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if $egress.enabled }}
    - Egress
    {{- end }}
  ingress:
    # The web ports (gateway/ingress backends) and, with a mail edge, the
    # mail binds. The console (8480) is absent on purpose: port-forward
    # reaches it from inside the pod's network namespace.
    - ports:
        - { port: {{ .Values.web.httpPort }}, protocol: TCP }
        - { port: {{ .Values.web.httpsPort }}, protocol: TCP }
        {{- if include "mailnite.mailEdge" . }}
        {{- range include "mailnite.mailPorts" . | fromJsonArray }}
        {{- if ne (int .targetPort) (int $.Values.web.httpsPort) }}
        - { port: {{ .targetPort }}, protocol: TCP }
        {{- end }}
        {{- end }}
        {{- end }}
      {{- with .Values.networkPolicy.ingress.from }}
      from: {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- with .Values.networkPolicy.ingress.additionalRules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- if $egress.enabled }}
  egress:
    - ports:
        {{- toYaml $egress.ports | nindent 8 }}
        {{- if include "mailnite.mintKeys" . }}
        # The key init container talks to the API server (post-DNAT port).
        {{- range $egress.apiServerPorts }}
        - { port: {{ . }}, protocol: TCP }
        {{- end }}
        {{- end }}
        {{- if eq .Values.exposure "relay" }}
        # The wizard's automatic VDS setup (SSH) and the relay tunnel.
        {{- toYaml $egress.relayPorts | nindent 8 }}
        {{- end }}
      {{- with $egress.to }}
      to: {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- with $egress.additionalRules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
