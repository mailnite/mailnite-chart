{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mailnite.fullname" . }}
  labels: {{- include "mailnite.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "mailnite.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.egress.enabled }}
    - Egress
    {{- end }}
  ingress:
    - ports:
        - { port: {{ .Values.service.web.httpPort }}, protocol: TCP }
        - { port: {{ .Values.service.web.httpsPort }}, protocol: TCP }
        {{- if .Values.service.mail.enabled }}
        {{- range .Values.service.mail.ports }}
        - { port: {{ .targetPort }}, protocol: TCP }
        {{- end }}
        {{- end }}
      {{- with .Values.networkPolicy.ingress.from }}
      from: {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- with .Values.networkPolicy.ingress.additionalRules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- if .Values.networkPolicy.egress.enabled }}
  egress:
    - ports: {{- toYaml .Values.networkPolicy.egress.ports | nindent 8 }}
      {{- with .Values.networkPolicy.egress.to }}
      to: {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- with .Values.networkPolicy.egress.additionalRules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
